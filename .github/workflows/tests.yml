name: tests
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Ortus-Solutions/setup-commandbox@v2.0.1
      - run: box install testbox-cli
      - run: box install
      - run: box server start cfengine=lucee@6 port=8080 openbrowser=false
      - run: |
          ls -R models tests
          box server info
          curl -i http://localhost:8080/tests/runner.cfm
      - run: box testbox run